plugins {
    id 'base'
}

tasks.named('clean') {
    doFirst {
        delete('reports')
    }
}

allprojects {
    group = 'com.parasoft.jscov'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }
}

def rootTest = tasks.register('test') {
    group = 'verification'
    description = 'Runs all project tests.'
}

// Java-only repositories/config go here to avoid affecting non-Java modules (e.g., integration Node modules).
subprojects {
    plugins.withId('java') {
        repositories {
            maven {
                name = 'Parasoft'
                url = uri('https://build.parasoft.com/maven')
            }

            maven {
                name = 'parasoft-pl-release'
                url = uri('http://dragon.parasoft.com:8081/nexus/content/repositories/parasoft-pl-releases/')
                allowInsecureProtocol true
            }

            maven {
                name = 'nexus-pl-thirdparty'
                url = uri('http://dragon.parasoft.com:8081/nexus/content/repositories/nexus-pl-thirdparty/')
                allowInsecureProtocol true
            }
        }

        ext.junitBomVersion = '5.10.2'
        ext.parasoftXtestCoverageAllVersion = '10.7.4.20260717'
        ext.log4jVersion = '2.25.4'
        ext.mockitoVersion = '5.14.2'
        ext.jsonSchemaValidator = '2.0.4'
    }

}

gradle.projectsEvaluated {
    def testDeps = subprojects.collectMany { p ->
        [p.tasks.findByName('test')]
    }.findAll { it != null }

    rootTest.configure {
        dependsOn(testDeps)
    }
}

def integrationNodeProjects = subprojects.findAll { it.path.startsWith(':integration:') }

// Resolve and consume each integration module's published dist artifact(s) via configuration,
// instead of hard-coding task names like `integrationTgz` in the root build.
def integrationDistByProject = [:]
integrationNodeProjects.each { p ->
    def cfgName = "integrationDist_${p.name.replaceAll('[^A-Za-z0-9]', '_')}"
    def cfg = configurations.create(cfgName) {
        canBeConsumed = false
        canBeResolved = true
        description = "Resolves integration dist artifacts from ${p.path}"
    }

    dependencies.add(cfgName, dependencies.project(path: p.path, configuration: 'integrationDistElements'))
    integrationDistByProject[p] = cfg
}

tasks.register('distribution', Zip) {
    group = 'distribution'
    description = 'Builds the distribution zip artifact.'

    archiveFileName = "parasoft_javascript_coverage_${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')

    // Keep stable ordering while preserving source file timestamps in the distribution.
    reproducibleFileOrder = true
    preserveFileTimestamps = true

    dependsOn(project(':javascript-coverage-cli').tasks.named('shadowJar'))
    // Ensure integration dist artifacts are built before packaging.
    dependsOn(integrationDistByProject.values().collect { it.buildDependencies })

    doFirst {
        logger.lifecycle("Packaging integration modules: ${integrationDistByProject.keySet().collect { it.path }.join(', ')}")
    }

    // manuals/
    from('manuals') {
        into('manuals')
    }

    // licenses/
    from('licenses') {
        into('licenses')
    }

    // integration/<module>/ (module-published dist artifacts)
    integrationDistByProject.each { p, cfg ->
        from(cfg) {
            into("integration/${p.name}")
        }
    }

    // EULA.txt + settings.properties at zip root
    from('dist-resources') {
        include 'EULA.txt'
        include 'settings.properties'
        into('')
    }

    // parasoft-jscov.jar at zip root (module runnable jar)
    from(project(':javascript-coverage-cli').tasks.named('shadowJar')) {
        into('')
    }
}

tasks.register('dist') {
    group = 'distribution'
    description = 'Alias for distribution zip build.'
    dependsOn(tasks.named('distribution'))
}
