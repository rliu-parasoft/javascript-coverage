subprojects {
    // Provide standard lifecycle tasks like `clean` (deletes this project's build/ directory).
    apply plugin: 'base'

    plugins.withId('com.github.node-gradle.node') {
        node {
            version = "24.11.1"
            download = true
        }

        tasks.matching { task ->
            task.name.startsWith('npm') || task.name in ['test', 'lintReport']
        }.configureEach {
            // Gradle 9 snapshots the task's node_modules output tree. Node's .bin entries can be symlinks or
            // non-regular files on Windows, which makes state tracking fail even though npm install is valid.
            doNotTrackState('Node install output is not a regular file tree and is intentionally not tracked by Gradle.')
            if (name in ['test', 'lintReport']) {
                ignoreExitValue.set(true)
            }
        }
    }

    // Each integration module should publish one or more explicit distribution artifacts via this configuration.
    configurations.maybeCreate('integrationDistElements').tap {
        canBeConsumed = true
        canBeResolved = false
        description = 'Outgoing distribution artifacts for root packaging (e.g., .tgz, folder, etc.).'
    }
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs all integration module test tasks.'
}

tasks.register('lintReport') {
    group = 'verification'
    description = 'Runs all integration module lintReport tasks.'
}

gradle.projectsEvaluated {
    def testDeps = subprojects.collectMany { p ->
        [p.tasks.findByName('test')]
    }.findAll { it != null }

    tasks.named('test').configure {
        dependsOn(testDeps)
    }

    def lintReportDeps = subprojects.collectMany { p ->
        [p.tasks.findByName('lintReport')]
    }.findAll { it != null }

    tasks.named('lintReport').configure {
        dependsOn(lintReportDeps)
    }
}
