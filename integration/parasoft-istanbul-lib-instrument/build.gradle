import com.github.gradle.node.npm.task.NpmTask
import groovy.json.JsonSlurper

plugins {
    id 'com.github.node-gradle.node' version '7.0.2'
}

def packageJson = new JsonSlurper().parse(file('package.json'))
def integrationDistDir = layout.buildDirectory.dir('integrationDist')
def integrationTgzFile = integrationDistDir.map {
    it.file("${packageJson.name}-${packageJson.version}.tgz")
}

tasks.register('integrationTgz', NpmTask) {
    group = 'build'
    description = 'Builds the integration distribution artifact (.tgz) for root packaging.'

    dependsOn(tasks.named('nodeSetup'))
    workingDir.set(projectDir)
    doFirst {
        integrationDistDir.get().asFile.mkdirs()
    }
    args = ['pack', '--pack-destination', integrationDistDir.get().asFile.absolutePath]
}

tasks.register('test', NpmTask) {
    group = 'verification'
    description = 'Runs the module npm test suite.'

    dependsOn(tasks.named('npmInstall'))
    workingDir.set(projectDir)
    doFirst {
        project.file('build/test-results/test').mkdirs()
    }
    args = ['test']
}

tasks.register('lintReport', NpmTask) {
    group = 'verification'
    description = 'Runs the module npm lint and writes a Checkstyle XML report for Jenkins Warnings NG.'

    dependsOn(tasks.named('npmInstall'))
    workingDir.set(projectDir)
    args = ['run', 'lint:report']
}

artifacts {
    integrationDistElements(integrationTgzFile) {
        builtBy(tasks.named('integrationTgz'))
    }
}
