plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.1.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
}

application {
    // CLI entrypoint
    mainClass = 'com.parasoft.jscov.JavascriptCoverage'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    inputs.files(configurations.mockitoAgent)
    doFirst {
        jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
    }
}

jar {
    manifest {
        attributes('Main-Class': application.mainClass.get())
        attributes('Implementation-Version': project.version)
    }
}

// Produce a single runnable jar (includes dependencies) for distribution packaging.
shadowJar {
    // Publish the runnable jar with the final expected name.
    archiveFileName = 'parasoft-jscov.jar'

    manifest {
        attributes('Main-Class': application.mainClass.get())
        attributes('Implementation-Version': project.version)
    }
}

tasks.named('assemble') {
    dependsOn(tasks.named('shadowJar'))
}

configurations {
    mockitoAgent
}

dependencies {
    implementation "com.parasoft.xtest.common:com.parasoft.xtest.coverage.all:${parasoftXtestCoverageAllVersion}"
    implementation "com.networknt:json-schema-validator:${jsonSchemaValidator}"
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"

    testImplementation platform("org.junit:junit-bom:${junitBomVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    mockitoAgent("org.mockito:mockito-core:${mockitoVersion}") { transitive = false }
}
