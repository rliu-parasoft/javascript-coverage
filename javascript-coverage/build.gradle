plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.1.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
}

application {
    // CLI entrypoint
    mainClass = 'com.parasoft.jscov.JavascriptCoverage'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes('Main-Class': application.mainClass.get())
        attributes('Implementation-Version': project.version)
    }
}

// Produce a single runnable jar (includes dependencies) for distribution packaging.
shadowJar {
    // Publish the runnable jar with the final expected name.
    archiveFileName = 'jscov.jar'

    manifest {
        attributes('Main-Class': application.mainClass.get())
        attributes('Implementation-Version': project.version)
    }
}

tasks.named('assemble') {
    dependsOn(tasks.named('shadowJar'))
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}
